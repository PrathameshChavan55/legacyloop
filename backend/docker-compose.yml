# Full stack: infrastructure + all seven Spring Boot services.
#
#   cp .env.example .env      (fill in the passwords and JWT_SECRET first)
#   docker compose up -d --build
#
# First build pulls the whole Spring dependency tree - allow 10-15 minutes. Afterwards
# Docker layer caching makes rebuilds fast.
#
# The React frontend is behind a profile until that repo exists:
#   docker compose --profile frontend up -d

services:

  # ============================ infrastructure ============================

  mysql:
    image: mysql:8.0.36
    container_name: ll-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/sql/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks: [legacyloop]

  mongodb:
    image: mongo:7.0
    container_name: ll-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo/01-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [legacyloop]

  redis:
    image: redis:7.4-alpine
    container_name: ll-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [legacyloop]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ll-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [legacyloop]

  zipkin:
    image: openzipkin/zipkin:3
    container_name: ll-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks: [legacyloop]

  # ============================ platform services ============================

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: ll-eureka-server
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: ll-eureka-server
    ports:
      - "8761:8761"
    networks: [legacyloop]

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: ll-config-server
    restart: unless-stopped
    env_file: .env
    environment:
      EUREKA_URL: http://ll-eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/app/config-repo
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks: [legacyloop]

  # ============================ business services ============================

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ll-auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://ll-config-server:8888
      EUREKA_URL: http://ll-eureka-server:8761/eureka/
      MYSQL_HOST: ll-mysql
      MYSQL_PORT: 3306
      REDIS_HOST: ll-redis
      RABBITMQ_HOST: ll-rabbitmq
      ZIPKIN_URL: http://ll-zipkin:9411/api/v2/spans
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks: [legacyloop]

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    container_name: ll-core-service
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://ll-config-server:8888
      EUREKA_URL: http://ll-eureka-server:8761/eureka/
      MYSQL_HOST: ll-mysql
      MYSQL_PORT: 3306
      REDIS_HOST: ll-redis
      RABBITMQ_HOST: ll-rabbitmq
      ZIPKIN_URL: http://ll-zipkin:9411/api/v2/spans
      STORAGE_LOCAL_DIR: /app/uploads
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - uploads_data:/app/uploads
    networks: [legacyloop]

  feed-service:
    build:
      context: .
      dockerfile: feed-service/Dockerfile
    container_name: ll-feed-service
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://ll-config-server:8888
      EUREKA_URL: http://ll-eureka-server:8761/eureka/
      MONGO_HOST: ll-mongodb
      MONGO_PORT: 27017
      REDIS_HOST: ll-redis
      RABBITMQ_HOST: ll-rabbitmq
      ZIPKIN_URL: http://ll-zipkin:9411/api/v2/spans
    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks: [legacyloop]

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ll-payment-service
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://ll-config-server:8888
      EUREKA_URL: http://ll-eureka-server:8761/eureka/
      MYSQL_HOST: ll-mysql
      MYSQL_PORT: 3306
      RABBITMQ_HOST: ll-rabbitmq
      ZIPKIN_URL: http://ll-zipkin:9411/api/v2/spans
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks: [legacyloop]

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ll-api-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://ll-config-server:8888
      EUREKA_URL: http://ll-eureka-server:8761/eureka/
      REDIS_HOST: ll-redis
      ZIPKIN_URL: http://ll-zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks: [legacyloop]

  # ============================ optional ============================

  frontend:
    profiles: ["frontend"]
    build:
      context: ../LegacyLoop-frontend
      dockerfile: Dockerfile
    container_name: ll-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_WS_URL: ${VITE_WS_URL}
    ports:
      - "3001:80"
    depends_on:
      - api-gateway
    networks: [legacyloop]

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.0.1
    container_name: ll-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [legacyloop]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    container_name: ll-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [legacyloop]

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  rabbit_data:
  uploads_data:
  prometheus_data:
  grafana_data:

networks:
  legacyloop:
    name: legacyloop-network
    driver: bridge
