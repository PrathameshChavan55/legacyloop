# =============================================================================
# auth-service-aws.yml — auth-service overrides for the `aws` profile
#
# Replaces Docker MySQL with Amazon Aurora MySQL.
# Aurora endpoint format: <cluster>.cluster-<id>.<region>.rds.amazonaws.com
#
# AURORA_HOST       = writer endpoint (use the cluster endpoint, not instance)
# AURORA_PORT       = 3306 (default)
# MYSQL_USER        = DB username (same as existing var)
# MYSQL_PASSWORD    = DB password  (same as existing var)
# AUTH_DB_NAME      = legacyloop_auth (same as existing var)
# =============================================================================

spring:
  datasource:
    # Aurora MySQL requires useSSL=true. requireSSL=true enforces the TLS
    # handshake so a misconfigured connection fails loudly rather than silently
    # falling back to plaintext.
    url: >-
      jdbc:mysql://${AURORA_HOST}:${AURORA_PORT:3306}/${AUTH_DB_NAME:legacyloop_auth}
      ?useSSL=true
      &requireSSL=true
      &verifyServerCertificate=true
      &serverTimezone=UTC
      &characterEncoding=utf8
      &cachePrepStmts=true
      &useServerPrepStmts=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Aurora supports up to 16,000 connections per writer instance.
      # A pool of 20 is conservative and safe for most load levels.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      # Aurora briefly interrupts connections during a failover (~30s).
      # keepalive-time pings idle connections before they silently die.
      keepalive-time: 60000
      pool-name: auth-aurora-hikari
  jpa:
    hibernate:
      ddl-auto: validate       # schema owned by Flyway — never let Hibernate touch it
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 25
        default_batch_fetch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

legacyloop:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:legacyloop}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  mail:
    enabled: ${MAIL_ENABLED:true}    # production: send real emails
    from: ${MAIL_FROM:noreply@legacyloop.in}
  institution:
    code: ${INSTITUTION_CODE:DEFAULT}
    name: ${INSTITUTION_NAME:}
    short-name: ${INSTITUTION_SHORT_NAME:}
    logo-url: ${INSTITUTION_LOGO_URL:}
    address: ${INSTITUTION_ADDRESS:}
    contact-email: ${INSTITUTION_EMAIL:}
    contact-phone: ${INSTITUTION_PHONE:}
    website: ${INSTITUTION_WEBSITE:}
    theme-color: ${INSTITUTION_THEME_COLOR:#1F3BB3}
    academic-year: ${INSTITUTION_ACADEMIC_YEAR:}
    identifier-label: ${STUDENT_IDENTIFIER_LABEL:Student ID}
    identifier-regex: ${STUDENT_IDENTIFIER_REGEX:^[A-Za-z0-9/-]{4,32}$}
    identifier-hint: ${STUDENT_IDENTIFIER_HINT:4-32 letters, digits, hyphen or slash}
    staff-role-label: ${STAFF_ROLE_LABEL:Institution Staff}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:Platform Administrator}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
