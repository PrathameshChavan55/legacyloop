# =============================================================================
# core-service-aws.yml — core-service overrides for the `aws` profile
#
# Replaces:
#   Docker MySQL  →  Amazon Aurora MySQL (writer endpoint)
#   Local storage →  Amazon S3 (STORAGE_LOCAL forced to false)
#
# AURORA_HOST         = Aurora cluster writer endpoint
# AURORA_PORT         = 3306
# CORE_DB_NAME        = legacyloop_core
# AWS_S3_BUCKET       = S3 bucket name
# AWS_REGION          = AWS region (e.g. ap-south-1)
# AWS_ACCESS_KEY_ID   = IAM access key (or use instance profile — see note)
# AWS_SECRET_ACCESS_KEY = IAM secret (or use instance profile)
#
# NOTE: On EC2 with an IAM instance profile, leave AWS_ACCESS_KEY_ID and
#       AWS_SECRET_ACCESS_KEY blank — the SDK picks up the role automatically.
#       This is the recommended approach; avoid long-lived access keys on EC2.
# =============================================================================

spring:
  datasource:
    url: >-
      jdbc:mysql://${AURORA_HOST}:${AURORA_PORT:3306}/${CORE_DB_NAME:legacyloop_core}
      ?useSSL=true
      &requireSSL=true
      &verifyServerCertificate=true
      &serverTimezone=UTC
      &characterEncoding=utf8
      &cachePrepStmts=true
      &useServerPrepStmts=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # core-service handles jobs, applications, AI pipeline — higher concurrency
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 20000
      keepalive-time: 60000
      pool-name: core-aurora-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 25
        default_batch_fetch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  rabbitmq:
    listener:
      simple:
        concurrency: 1
        max-concurrency: 3
        prefetch: 1

legacyloop:
  storage:
    # S3 is always on in the aws profile — local filesystem storage is
    # inappropriate for multi-instance or containerised deployments.
    local: false
    bucket: ${AWS_S3_BUCKET:legacyloop-media}
    region: ${AWS_REGION:ap-south-1}
    # Leave blank when running on EC2 with an IAM instance profile.
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presign-minutes: ${AWS_S3_PRESIGN_MINUTES:15}
  ai:
    provider: ${AI_PROVIDER:GEMINI}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3}
