# =============================================================================
# feed-service-aws.yml — feed-service overrides for the `aws` profile
#
# Replaces Docker MongoDB with Amazon DocumentDB.
#
# IMPORTANT — DocumentDB TLS requirements:
#   1. DocumentDB ALWAYS uses TLS (cannot be disabled in most configurations).
#   2. The connection URI must include:
#        ssl=true&tlsAllowInvalidHostnames=true&retryWrites=false
#      • tlsAllowInvalidHostnames=true  — DocumentDB uses *.docdb.amazonaws.com
#        hostnames; the Java MongoDB driver validates them differently from the
#        self-signed RDS bundle without this flag.
#      • retryWrites=false             — DocumentDB does not support retryable
#        writes; Spring Data MongoDB defaults to true which causes errors.
#   3. The CA bundle (global-bundle.pem) must be present inside the container
#      at DOCDB_TLS_CA_FILE path (default: /app/config/global-bundle.pem).
#      Download from: https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
#      Mount it via docker-compose.aws.yml volume.
#
# DOCDB_HOST         = <cluster>.cluster-<id>.<region>.docdb.amazonaws.com
# DOCDB_PORT         = 27017
# MONGO_APP_USER     = DocumentDB username (same var as existing)
# MONGO_APP_PASSWORD = DocumentDB password (same var as existing)
# MONGO_DB_NAME      = legacyloop_feed (same var as existing)
# DOCDB_TLS_CA_FILE  = path to the global-bundle.pem inside the container
# =============================================================================

spring:
  data:
    mongodb:
      # DocumentDB-compatible URI with mandatory TLS flags.
      # The tlsCAFile parameter points to the RDS CA bundle mounted in the container.
      uri: >-
        mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@${DOCDB_HOST}:${DOCDB_PORT:27017}/${MONGO_DB_NAME:legacyloop_feed}
        ?ssl=true
        &tlsAllowInvalidHostnames=true
        &retryWrites=false
        &readPreference=secondaryPreferred
        &authSource=${MONGO_DB_NAME:legacyloop_feed}
      # auto-index-creation is fine in dev; on DocumentDB it still works but
      # indexes should be created explicitly in production for performance.
      auto-index-creation: false
  rabbitmq:
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5

legacyloop:
  jwt:
    # Needed only for the STOMP handshake - HTTP routes trust the gateway headers.
    secret: ${JWT_SECRET}

# DocumentDB TLS CA file location — injected as a JVM system property by the
# entrypoint. The docker-compose.aws.yml ENTRYPOINT passes:
#   -Djavax.net.ssl.trustStore=<path>
# Alternatively set JAVA_OPTS in the environment:
#   JAVA_OPTS: "-Djavax.net.ssl.trustStore=/app/config/global-bundle.jks -Djavax.net.ssl.trustStorePassword=changeit"
# See docker-compose.aws.yml for the complete setup.
