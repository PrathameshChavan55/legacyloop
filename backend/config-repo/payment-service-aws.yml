# =============================================================================
# payment-service-aws.yml — payment-service overrides for the `aws` profile
#
# Replaces Docker MySQL with Amazon Aurora MySQL.
#
# AURORA_HOST       = Aurora cluster writer endpoint
# AURORA_PORT       = 3306
# PAYMENT_DB_NAME   = legacyloop_payment
# MYSQL_USER        = DB username
# MYSQL_PASSWORD    = DB password
# =============================================================================

spring:
  datasource:
    url: >-
      jdbc:mysql://${AURORA_HOST}:${AURORA_PORT:3306}/${PAYMENT_DB_NAME:legacyloop_payment}
      ?useSSL=true
      &requireSSL=true
      &verifyServerCertificate=true
      &serverTimezone=UTC
      &characterEncoding=utf8
      &cachePrepStmts=true
      &useServerPrepStmts=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Payment service has lower concurrency than core; Razorpay webhooks are
      # serialised so a small pool is correct and intentional.
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      keepalive-time: 60000
      pool-name: payment-aurora-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

legacyloop:
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: ${RAZORPAY_CURRENCY:INR}
