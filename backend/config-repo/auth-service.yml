spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${AUTH_DB_NAME:legacyloop_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:cdac}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      pool-name: auth-hikari
  jpa:
    hibernate:
      # NEVER 'update'. The schema belongs to Flyway; validate makes a drift fail loudly.
      ddl-auto: validate
    open-in-view: false          # stops lazy loading leaking into the view layer
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 25
        default_batch_fetch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

legacyloop:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:legacyloop}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  mail:
    enabled: ${MAIL_ENABLED:false}    # false in dev: the OTP is printed to the console instead
    from: ${MAIL_FROM:noreply@legacyloop.in}
  institution:
    # Everything below is a first-run default only. Once the platform is running, an
    # administrator edits these in the UI and these values are ignored.
    code: ${INSTITUTION_CODE:DEFAULT}
    name: ${INSTITUTION_NAME:}
    short-name: ${INSTITUTION_SHORT_NAME:}
    logo-url: ${INSTITUTION_LOGO_URL:}
    address: ${INSTITUTION_ADDRESS:}
    contact-email: ${INSTITUTION_EMAIL:}
    contact-phone: ${INSTITUTION_PHONE:}
    website: ${INSTITUTION_WEBSITE:}
    theme-color: ${INSTITUTION_THEME_COLOR:#1F3BB3}
    academic-year: ${INSTITUTION_ACADEMIC_YEAR:}
    # What this institution calls its student identifier, and the format it accepts.
    identifier-label: ${STUDENT_IDENTIFIER_LABEL:Student ID}
    identifier-regex: ${STUDENT_IDENTIFIER_REGEX:^[A-Za-z0-9/-]{4,32}$}
    identifier-hint: ${STUDENT_IDENTIFIER_HINT:4-32 letters, digits, hyphen or slash}
    staff-role-label: ${STAFF_ROLE_LABEL:Institution Staff}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:Platform Administrator}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
