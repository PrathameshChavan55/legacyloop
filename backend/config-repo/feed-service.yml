spring:
  data:
    mongodb:
      # MONGO_URI accepts a full connection string (mongodb+srv:// for Atlas,
      # or a plain mongodb:// for local/Docker).
      # If MONGO_URI is set in .env it takes precedence over host/port vars.
      # Local Docker fallback: mongodb://legacyloop:legacyloop@localhost:27017/legacyloop_feed?authSource=legacyloop_feed
      uri: ${MONGO_URI:mongodb://${MONGO_APP_USER:legacyloop}:${MONGO_APP_PASSWORD:legacyloop}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB_NAME:legacyloop_feed}?authSource=${MONGO_DB_NAME:legacyloop_feed}}
      database: ${MONGO_DB_NAME:legacyloop_feed}
      auto-index-creation: true
  rabbitmq:
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5

legacyloop:
  jwt:
    # Needed only for the STOMP handshake - HTTP routes trust the gateway headers.
    secret: ${JWT_SECRET}
