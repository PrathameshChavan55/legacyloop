spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:legacyloop}
    password: ${RABBITMQ_PASSWORD:legacyloop}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false   # rejected messages go to the DLQ, not into a hot loop
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

logging:
  level:
    root: INFO
    com.legacyloop: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # shows bound parameters - dev only

management:
  endpoint:
    health:
      show-details: always
