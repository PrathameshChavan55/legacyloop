server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Content-Disposition
              - Authorization
            allowCredentials: true
      routes:
        # User Service routes
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/**,/api/v1/institutions/**,/api/v1/academics/**,/api/v1/profiles/**,/api/v1/plans/**,/api/v1/orders/**,/api/v1/payments/**,/api/v1/subscriptions/**

        # Career Service routes
        - id: career-service
          uri: ${CAREER_SERVICE_URL:http://career-service:8082}
          predicates:
            - Path=/api/v1/jobs/**,/api/v1/applications/**,/api/v1/resumes/**,/api/v1/ai/**,/api/v1/analytics/**

        # Social Service routes
        - id: social-service
          uri: ${SOCIAL_SERVICE_URL:http://social-service:8083}
          predicates:
            - Path=/api/v1/posts/**,/api/v1/network/**,/api/v1/conversations/**,/api/v1/notifications/**

        # Social Service WebSocket
        - id: social-service-ws
          uri: ${SOCIAL_SERVICE_WS_URL:ws://social-service:8083}
          predicates:
            - Path=/ws/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
