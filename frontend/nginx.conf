# Nginx does in production what the Vite proxy does in development, and what an API gateway did
# in the original: it looks at the path prefix and forwards to the service that owns it.
#
# That is the whole routing layer. There is no service discovery because the service names are
# fixed by docker-compose, and no gateway filters because authentication is a JWT each service
# already verifies for itself.

upstream api_gateway { server api-gateway:8080; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # --- API Gateway: all /api/v1 routes
    location /api/ {
        proxy_pass http://api_gateway;
        include /etc/nginx/proxy_headers.conf;
    }

    # --- WebSocket routed through API Gateway
    location /ws {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # --- the built React app; unknown paths fall back to index.html so client routing works
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
